[bar.default]
capsule = true
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "group:g1",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "Inter"
margin_ends = 0
radius = 0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "volume", "input_volume" ]
    opacity = 1.0
    padding = 6.0

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[calendar]

[control_center.calendar]
show_week_numbers = true

[desktop_widgets]
enabled = false

[dock]
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1",
    "lockscreen-widget-0000000000000001"
]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 128.0
    box_width = 810.0
    cx = 1280.0
    cy = 1262.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = false
        show_login_button = false
        show_media = false
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-2"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 448.0
    box_width = 832.0
    cx = 1280.0
    cy = 304.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        color = "on_surface_variant"
        font_family = ""

[osd]
position = "bottom_left"

[shell]
corner_radius_scale = 0.5000000074505806
font_family = "Inter"
polkit_agent = true
screen_time_enabled = true
show_location = false

    [shell.launcher]
    categories = false

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.windows]
        global = true

    [shell.panel]
    clipboard_placement = "attached"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/rhf/Pictures/wallpaper.png"

[wallpaper.last]
path = "/home/rhf/Pictures/wallpaper.png"

[wallpaper.monitors.DP-1]
path = "/home/rhf/Pictures/wallpaper.png"

[wallpaper.monitors.DP-2]
path = "/home/rhf/Pictures/wallpaper.png"

[wallpaper.monitors.eDP-1]
path = "/home/rhf/Pictures/wallpaper.png"

[[wallpaper.favorite]]
community_palette = "Oxocarbon"
palette_source = "community"
path = "/home/rhf/Pictures/wallpaper.png"
theme_mode = "dark"

[widget.clock]
format = "{:%A %-d %b %H:%M}"

[widget.network]
show_label = false

[widget.wallpaper]
enabled = false

[widget.workspaces]
change_color_on_hover = false
font_family = "Inter ExtraBold"
occupied_color = "outline"
